<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" class="lp-bg"/>
  <!-- Haptic touch pulse ring (The "Press") -->
  <circle cx="32" cy="25" r="13" stroke="#FF3B14" stroke-width="3" stroke-dasharray="3 2" opacity="0.95"/>
  <circle cx="32" cy="25" r="7" fill="#FF3B14"/>
  <!-- Sustained duration bar (The "Long" hold) -->
  <rect x="14" y="44" width="36" height="5.5" rx="2.75" class="lp-bar"/>
  <style>
    .lp-bg { fill: #121316; }
    .lp-bar { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .lp-bg { fill: #1B1C22; }
      .lp-bar { fill: #F4F4F0; }
    }
  </style>
</svg>

