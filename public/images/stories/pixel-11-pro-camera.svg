<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="pixelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F1D"/>
      <stop offset="100%" stop-color="#161A2B"/>
    </linearGradient>
    <linearGradient id="sensorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>
    <pattern id="pixelGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#pixelBg)"/>
  <rect width="1200" height="675" fill="url(#pixelGrid)"/>

  <!-- Top metadata bar -->
  <text x="70" y="70" font-family="'Space Mono', monospace" font-size="12" font-weight="700" letter-spacing="3" fill="#E0552B" text-transform="uppercase">LONG PRESS · KNOWN ISSUE HARDWARE DISPATCH</text>
  <text x="1130" y="70" font-family="'Space Mono', monospace" font-size="12" font-weight="600" letter-spacing="1" fill="#7C809E" text-anchor="end">FIG. P11-PRO · TENSOR G6 OPTICAL PIPELINE</text>
  <line x1="70" y1="88" x2="1130" y2="88" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- Iconic Camera Visor Bar -->
  <g transform="translate(140, 200)">
    <!-- Visor pill outline -->
    <rect x="0" y="0" width="400" height="150" rx="75" fill="#131522" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2.5"/>
    
    <!-- Cutout pill for main + ultrawide sensors -->
    <rect x="35" y="32" width="180" height="86" rx="43" fill="#080911" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="80" cy="75" r="30" fill="#131422" stroke="#E0552B" stroke-width="2"/>
    <circle cx="80" cy="75" r="16" fill="#0E0F1D" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="170" cy="75" r="30" fill="#131422" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <circle cx="170" cy="75" r="16" fill="#0E0F1D" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Folded Periscope Aperture (Rectangular) -->
    <rect x="250" y="45" width="60" height="60" rx="14" fill="#080911" stroke="url(#sensorGlow)" stroke-width="2"/>
    <circle cx="280" cy="75" r="18" fill="#141829"/>

    <!-- Sensor + Flash -->
    <circle cx="345" cy="55" r="8" fill="#F8FAFC" opacity="0.9"/>
    <rect x="340" y="85" width="10" height="10" rx="3" fill="#E0552B" opacity="0.8"/>
  </g>

  <!-- Spec Annotations -->
  <g transform="translate(600, 160)">
    <text x="0" y="30" font-family="'Bricolage Grotesque', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Pixel 11 Pro Camera Stack</text>
    <text x="0" y="60" font-family="'Space Mono', monospace" font-size="14" fill="#E0552B">OPTICAL GLASS MEETS GENERATIVE ZOOM</text>

    <!-- Point 1 -->
    <g transform="translate(0, 105)">
      <circle cx="12" cy="12" r="12" fill="rgba(224, 85, 43, 0.15)" stroke="#E0552B" stroke-width="1.5"/>
      <text x="12" y="16" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#E0552B" text-anchor="middle">1</text>
      <text x="36" y="10" font-family="'Bricolage Grotesque', sans-serif" font-size="17" font-weight="700" fill="#F4F1E8">Folded 5x Periscope + Super Res AI</text>
      <text x="36" y="32" font-family="'Newsreader', serif" font-size="15" fill="#A0A3BD">Generative neural reconstruction renders clean text and detail up to 30x reach.</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(0, 185)">
      <circle cx="12" cy="12" r="12" fill="rgba(224, 85, 43, 0.15)" stroke="#E0552B" stroke-width="1.5"/>
      <text x="12" y="16" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#E0552B" text-anchor="middle">2</text>
      <text x="36" y="10" font-family="'Bricolage Grotesque', sans-serif" font-size="17" font-weight="700" fill="#F4F1E8">Tensor G6 TSMC N3P Silicon</text>
      <text x="36" y="32" font-family="'Newsreader', serif" font-size="15" fill="#A0A3BD">Finally ends Tensor's historical battery drain and aggressive thermal throttling.</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(0, 265)">
      <circle cx="12" cy="12" r="12" fill="rgba(224, 85, 43, 0.15)" stroke="#E0552B" stroke-width="1.5"/>
      <text x="12" y="16" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#E0552B" text-anchor="middle">3</text>
      <text x="36" y="10" font-family="'Bricolage Grotesque', sans-serif" font-size="17" font-weight="700" fill="#F4F1E8">The Philosophical Dilemma</text>
      <text x="36" y="32" font-family="'Newsreader', serif" font-size="15" fill="#A0A3BD">At what zoom multiplier does a photograph stop being documentation and become AI art?</text>
    </g>
  </g>

  <!-- Bottom watermark -->
  <line x1="70" y1="615" x2="1130" y2="615" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="70" y="640" font-family="'Space Mono', monospace" font-size="11" fill="#7C809E">LONGPRESS.NEWS · HARDWARE OPINION · BY SWAMI GURU</text>
  <text x="1130" y="640" font-family="'Space Mono', monospace" font-size="11" fill="#7C809E" text-anchor="end">OPTICAL &amp; NEURAL SENSOR SCHEMATIC</text>
</svg>
