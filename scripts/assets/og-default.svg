    <path d="M0,-260 A260,260 0 0 1 184,184" fill="none" stroke="#F5F3FB" stroke-width="22" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="100" fill="#F5F3FB"/>
  </g>

  <circle cx="150" cy="90" r="5" fill="#7CC3B6" opacity="0.8"/>
  <circle cx="205" cy="130" r="4" fill="#F4F1E8" opacity="0.55"/>
  <path d="M420,64 l6,10 h-12 z" fill="#E0552B" opacity="0.85"/>
  <rect x="640" y="60" width="9" height="9" fill="#F4F1E8" opacity="0.6" transform="rotate(45 644.5 64.5)"/>
  <path d="M840,470 l7,12 h-14 z" fill="#7CC3B6" opacity="0.7"/>
  <circle cx="900" cy="510" r="4.5" fill="#E0552B" opacity="0.8"/>
  <rect x="960" y="440" width="9" height="9" fill="#E0552B" opacity="0.55" transform="rotate(45 964.5 444.5)"/>
  <g stroke="#F4F1E8" stroke-width="3" opacity="0.5">
    <line x1="1004" y1="500" x2="1016" y2="500"/>
    <line x1="1010" y1="494" x2="1010" y2="506"/>
  </g>
  <g stroke="#7CC3B6" stroke-width="3" opacity="0.6">
    <line x1="800" y1="390" x2="812" y2="390"/>
    <line x1="806" y1="384" x2="806" y2="396"/>
  </g>

  <g transform="translate(64,54)">
    <circle cx="19" cy="19" r="18" fill="none" stroke="#F5F3FB" stroke-width="2.6"/>
    <path d="M19,1 A18,18 0 0 1 32.7,31.2" fill="none" stroke="#E0552B" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="19" cy="19" r="7" fill="#F5F3FB"/>
  </g>
  <text x="114" y="66" font-family="Futura, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="0.5" fill="#F5F3FB">LONG<tspan fill="#E0552B">PRESS</tspan></text>

  <text x="1180" y="228" text-anchor="end" font-family="Menlo, Consolas, monospace" font-weight="700" font-size="13" letter-spacing="2.2" fill="#E0552B">LONGPRESS.NEWS</text>

  <text x="64" y="262" font-family="Futura, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="100" letter-spacing="-1" fill="#F5F3FB">PRESS AND</text>
  <text x="64" y="360" font-family="Futura, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="100" letter-spacing="-1" fill="#F5F3FB">HOLD<tspan fill="#E0552B">.</tspan></text>

  <text x="66" y="452" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="21" fill="#B9B6C8">Everyone else tells you what happened.</text>
  <text x="66" y="480" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="21" fill="#B9B6C8">We stay on it a beat longer.</text>

  <g transform="translate(220,522) rotate(-3)">
    <rect x="6" y="6" width="252" height="58" fill="#E0552B"/>
    <rect x="0" y="0" width="252" height="58" fill="#17182E" stroke="#E0552B" stroke-width="3"/>
    <circle cx="30" cy="29" r="10" fill="none" stroke="#E0552B" stroke-width="2"/>
    <circle cx="30" cy="29" r="3.6" fill="#E0552B"/>
    <text x="52" y="24" font-family="Menlo, Consolas, monospace" font-weight="700" font-size="11.5" letter-spacing="1.4" fill="#E0552B">THE DAILY FIVE</text>
    <text x="52" y="44" font-family="Menlo, Consolas, monospace" font-weight="700" font-size="11.5" letter-spacing="1.4" fill="#F4F1E8" opacity="0.75">10:00 IST EVERY MORNING</text>
  </g>

  <g transform="translate(500,530) rotate(2.4)">
    <rect x="6" y="6" width="252" height="58" fill="#7CC3B6"/>
    <rect x="0" y="0" width="252" height="58" fill="#17182E" stroke="#7CC3B6" stroke-width="3" stroke-dasharray="7 5"/>
    <circle cx="30" cy="29" r="10" fill="none" stroke="#7CC3B6" stroke-width="2"/>
    <circle cx="30" cy="29" r="3.6" fill="#7CC3B6"/>
    <text x="52" y="24" font-family="Menlo, Consolas, monospace" font-weight="700" font-size="11.5" letter-spacing="1.4" fill="#7CC3B6">KNOWN ISSUE</text>
    <text x="52" y="44" font-family="Menlo, Consolas, monospace" font-weight="700" font-size="11.5" letter-spacing="1.4" fill="#F4F1E8" opacity="0.75">STILL OPEN NO SCHEDULE</text>
  </g>

  <rect x="0" y="624" width="600" height="6" fill="#E0552B"/>
  <rect x="600" y="624" width="600" height="6" fill="#7CC3B6"/>
