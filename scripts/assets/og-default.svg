<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="checker" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="none"/>
      <rect width="13" height="13" x="0" y="0" fill="#F4F1E8"/>
      <rect width="13" height="13" x="13" y="13" fill="#F4F1E8"/>
    </pattern>
    <clipPath id="clip-tr">
      <path d="M1200,0 L1200,150 L1050,150 L1050,0 Z"/>
    </clipPath>
    <clipPath id="clip-bl">
      <path d="M0,630 L0,480 L150,480 L150,630 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#17182E"/>

  <g clip-path="url(#clip-tr)">
    <rect x="1050" y="0" width="150" height="150" fill="url(#checker)"/>
  </g>
  <g clip-path="url(#clip-bl)">
    <rect x="0" y="480" width="150" height="150" fill="url(#checker)"/>
  </g>

  <g transform="translate(940,300) rotate(-8)" opacity="0.07">
