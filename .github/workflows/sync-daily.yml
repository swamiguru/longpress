name: Sync daily brief (manual backstop)

# Long Press used to rely on this workflow's own cron to notice new content
# in the builtbyswami repo and publish it. That cron was unreliable enough to
# cause real gaps: a 4-hour-late run on 11 Sept, four silently-skipped slots
# on 16 Sept, and a run of failures through 17 Sept caused by a deleted
# package-lock.json elsewhere in this repo breaking `npm ci` on every
# scheduled attempt.
#
# As of 18 Sept, the daily generator task on the Mac runs
# `scripts/sync-daily.sh` itself as its own final step, right after it
# commits the roundup - so publishing no longer waits on GitHub's scheduler
# at all. This workflow is kept only as a manual escape hatch (e.g. the Mac
# is off, or the local sync step itself failed) - trigger it from the
# Actions tab or `gh workflow run sync-daily.yml --repo swamiguru/longpress`.

on:
  workflow_dispatch:        # manual only - no schedule; see comment above

concurrency:
  group: sync-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to commit the imported briefs back

    steps:
      - name: Check out Long Press
        uses: actions/checkout@v4

      - name: Check out the roundup source
        uses: actions/checkout@v4
        with:
          repository: swamiguru/builtbyswami
          path: .source
          # Fine-grained PAT with Contents:read on swamiguru/builtbyswami.
          # Store it in this repo under Settings > Secrets > Actions.
          token: ${{ secrets.ROUNDUP_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Import any new briefs
        run: node scripts/import-roundup.mjs .source

      - name: Stop here if nothing changed
        id: check
        run: |
          if git diff --quiet -- src/content/daily public/images/daily && \
             [ -z "$(git ls-files --others --exclude-standard -- src/content/daily public/images/daily)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new briefs."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- src/content/daily public/images/daily
          fi

      - name: Build (routing guard runs first and blocks on a bad slug)
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      - name: Publish
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "long-press-bot"
          git config user.email "builtbyswami@gmail.com"
          # public/images/daily: import-roundup.mjs copies each day's cards here
          # and the build's prebuild (optimize-images.mjs) generates their webp
          # variants alongside them. Both were being generated on the runner
          # and then discarded uncommitted - this is why card_2.png etc. 404'd
          # on the site starting the day card images were turned on (13 Sept).
          git add src/content/daily public/images/daily
          git commit -m "Daily brief: $(date -u +%Y-%m-%d)"
          git push
